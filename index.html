<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fieldwalk — Property Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1F26;
    --paper:#F5F2EA;
    --card:#FFFFFF;
    --amber:#C98A2C;
    --amber-dark:#8A5D18;
    --green:#3F7D5C;
    --green-dark:#295138;
    --red:#A63A2E;
    --red-dark:#6E261D;
    --steel:#63697A;
    --line:#DDD8CB;
    --line-strong:#C7C1AF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .frame{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }
  .topbar{
    background:var(--ink);
    color:#F5F2EA;
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:5;
  }
  .topbar .brand{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .topbar .back{
    background:none;
    border:none;
    color:#F5F2EA;
    font-size:14px;
    font-family:'IBM Plex Sans', sans-serif;
    cursor:pointer;
    padding:6px 4px;
    opacity:0.85;
  }
  .content{
    flex:1;
    padding:18px 18px 40px;
  }

  /* --- Inspection tag (signature element) --- */
  .tag{
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:4px;
    position:relative;
    padding:18px 18px 18px 34px;
    margin-bottom:20px;
    box-shadow:0 1px 0 rgba(0,0,0,0.03);
  }
  .tag::before{
    content:"";
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--paper);
    border:2px solid var(--ink);
  }
  .tag::after{
    content:"";
    position:absolute;
    left:16px;
    top:8px;
    bottom:8px;
    width:0;
    border-left:1.5px dashed var(--line-strong);
  }
  .tag-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--steel);
    margin:0 0 4px;
  }
  .tag-address{
    font-family:'Oswald', sans-serif;
    font-size:20px;
    font-weight:600;
    margin:0 0 8px;
    line-height:1.2;
  }
  .tag-meta{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-size:12.5px;
    color:var(--steel);
  }
  .tag-meta span b{color:var(--ink); font-weight:500;}
  .tag-progress{
    margin-top:12px;
    height:5px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .tag-progress-fill{
    height:100%;
    background:var(--amber);
    border-radius:3px;
    transition:width 0.25s ease;
  }

  h1,h2,h3{font-family:'Oswald', sans-serif; font-weight:600; margin:0;}
  .section-title{
    font-family:'Oswald', sans-serif;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--steel);
    margin:24px 0 10px;
  }
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:12px;
  }

  label{
    display:block;
    font-size:12.5px;
    font-weight:500;
    color:var(--steel);
    margin-bottom:5px;
  }
  input[type=text], input[type=date], select, textarea{
    width:100%;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    padding:9px 11px;
    border:1px solid var(--line-strong);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
    margin-bottom:14px;
  }
  input[type=text]:last-child, textarea:last-child, select:last-child{margin-bottom:0;}
  textarea{resize:vertical; min-height:56px; font-family:'IBM Plex Sans', sans-serif;}
  input.mono, .mono{font-family:'IBM Plex Mono', monospace;}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:11px 16px;
    border-radius:6px;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    width:100%;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .btn-amber{background:var(--amber); color:#fff; border-color:var(--amber-dark);}
  .btn-ghost{background:none; border-color:var(--line-strong);}
  .btn-sm{padding:7px 12px; font-size:13px; width:auto;}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{flex:1;}

  .room-list{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:16px;
  }
  .room-chip{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:20px;
    border:1px solid var(--line-strong);
    background:#fff;
    font-size:13px;
    font-weight:500;
    color:var(--steel);
    cursor:pointer;
    white-space:nowrap;
    position:relative;
  }
  .room-chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .room-chip.done::after{
    content:"";
    position:absolute;
    top:-3px; right:-3px;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--green);
    border:1.5px solid var(--paper);
  }

  .check-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .check-row:last-child{border-bottom:none;}
  .check-name{font-size:14px;}
  .cond-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:0.03em;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--steel);
    cursor:pointer;
  }
  .cond-btn.good{background:#EAF2ED; color:var(--green-dark); border-color:var(--green);}
  .cond-btn.fair{background:#F8EFE0; color:var(--amber-dark); border-color:var(--amber);}
  .cond-btn.poor{background:#F6E7E4; color:var(--red-dark); border-color:var(--red);}

  /* --- Media capture: walkthrough video + notated damage photos --- */
  .media-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin:10px 0 16px;}
  .video-thumb{
    position:relative;
    width:100px; height:74px;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line-strong);
    flex:0 0 auto;
    cursor:pointer;
    background:#000;
  }
  .video-thumb img{width:100%; height:100%; object-fit:cover; display:block; opacity:0.82;}
  .video-thumb .play{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:20px; text-shadow:0 1px 3px rgba(0,0,0,0.5);
  }
  .video-thumb .dur{
    position:absolute; bottom:3px; right:5px;
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    background:rgba(0,0,0,0.6); color:#fff; padding:1px 5px; border-radius:3px;
  }
  .video-thumb .del{
    position:absolute; top:3px; right:3px;
    background:rgba(0,0,0,0.55); color:#fff; border:none; border-radius:50%;
    width:18px; height:18px; font-size:12px; line-height:1; cursor:pointer;
  }
  .media-add{
    width:100px; height:74px;
    border-radius:6px;
    border:1.5px dashed var(--line-strong);
    background:none;
    color:var(--steel);
    font-size:13px;
    font-weight:500;
    flex:0 0 auto;
    cursor:pointer;
  }

  .dphoto-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:4px;}
  .dphoto{
    position:relative;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line-strong);
    cursor:pointer;
    aspect-ratio:1;
    background:var(--line);
  }
  .dphoto img{width:100%; height:100%; object-fit:cover; display:block;}
  .dphoto .flagdot{
    position:absolute; top:3px; left:3px;
    background:var(--red); color:#fff;
    font-size:9px; font-family:'IBM Plex Mono', monospace;
    padding:1px 5px; border-radius:8px; letter-spacing:0.03em;
  }
  .dphoto-add{
    border:1.5px dashed var(--line-strong);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--steel); font-size:22px;
    aspect-ratio:1; cursor:pointer; background:none;
  }

  .photo-editor{
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:12px 14px;
    margin:10px 0 16px;
    background:#FBFAF6;
  }
  .photo-editor img{width:100%; border-radius:6px; margin-bottom:10px; max-height:220px; object-fit:cover; cursor:pointer;}

  .lightbox{
    position:fixed; inset:0;
    background:rgba(10,10,10,0.92);
    z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .lightbox img, .lightbox video{max-width:100%; max-height:88vh; border-radius:6px;}
  .lightbox .close{
    position:absolute; top:16px; right:18px;
    background:none; border:none; color:#fff; font-size:28px; cursor:pointer; line-height:1;
  }
  .lightbox .loading{color:#fff; font-size:13px;}

  .appliance-card{
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:10px;
    background:#FBFAF6;
  }
  .appliance-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .appliance-head b{font-size:14px;}
  .appliance-head .remove{font-size:12px; color:var(--red); cursor:pointer; background:none; border:none;}
  .maint-hint{
    margin-top:8px;
    padding:8px 10px;
    background:#EEF2EE;
    border-left:2px solid var(--green);
    font-size:12px;
    color:var(--green-dark);
    line-height:1.5;
  }

  .flag-pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:3px 9px;
    border-radius:20px;
    background:#F6E7E4;
    color:var(--red-dark);
    margin:2px 4px 2px 0;
  }
  .good-pill{background:#EAF2ED; color:var(--green-dark);}

  .rating-pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:500;
    text-transform:uppercase;
    padding:3px 10px;
    border-radius:20px;
  }
  .rating-pill.good{background:#EAF2ED; color:var(--green-dark);}
  .rating-pill.fair{background:#F8EFE0; color:var(--amber-dark);}
  .rating-pill.poor{background:#F6E7E4; color:var(--red-dark);}

  .bar{height:7px; border-radius:4px; overflow:hidden; display:flex; background:var(--line); flex:1; min-width:50px;}
  .bar span{height:100%;}
  .summary-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .zn{width:92px; flex:0 0 auto; font-weight:500; font-size:13px;}
  .summary-row .cnt{flex:0 0 auto; width:44px; text-align:right; color:var(--steel);}

  .home-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .home-item .addr{font-weight:500; font-size:14.5px;}
  .home-item .sub{font-size:12px; color:var(--steel); margin-top:2px;}
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--steel);
  }
  .empty .ti{font-size:32px; display:block; margin-bottom:10px;}

  .report-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .report-row:last-child{border-bottom:none;}
  .report-row .k{color:var(--steel);}

  ::-webkit-scrollbar{display:none;}

  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .frame{max-width:100%; min-height:0;}
    .content{padding:0;}
    .tag{box-shadow:none;}
    .card, .appliance-card, .photo-editor{box-shadow:none; break-inside:avoid;}
    .section-title{break-after:avoid-page;}
    .dphoto-grid{break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="frame">
  <div class="topbar no-print">
    <button class="back" id="backBtn" style="visibility:hidden;">&larr; Back</button>
    <div class="brand" id="brandLabel">Fieldwalk</div>
    <div style="width:52px;"></div>
  </div>
  <div class="content" id="app"></div>
</div>
<div id="lightboxRoot"></div>

<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" multiple>
<input type="file" id="videoInput" accept="video/*" capture="environment" style="display:none;" multiple>
<input type="file" id="appliancePhotoInput" accept="image/*" capture="environment" style="display:none;">

<script>
const EXTERIOR_ZONES = ["Roof","Siding / exterior walls","Windows & doors (ext.)","Deck / porch / steps","Gutters & drainage","Foundation","Grounds / landscaping"];
const DEFAULT_ROOMS = ["Kitchen","Living room","Bedroom 1","Bathroom 1"];
const ROOM_CHECKLIST = ["Walls","Flooring","Ceiling","Windows","Doors","Trim / paint"];
const APPLIANCE_TYPES = {
  "Refrigerator": "Check door seals every 6 months; clean condenser coils annually.",
  "Range / oven": "Inspect burner igniters and door seal annually.",
  "Dishwasher": "Clean filter and inspect door gasket every 6 months.",
  "Washer": "Inspect hoses annually; clean detergent drawer every 3 months.",
  "Dryer": "Clean vent duct annually; check lint trap each turnover.",
  "Water heater": "Flush tank annually; test T&P valve annually; anode check at year 3-5.",
  "HVAC / furnace": "Replace filter every 90 days; annual professional tune-up.",
  "Microwave": "Inspect door seal and vent filter annually."
};

let state = { view: "home", inspections: {}, order: [], currentId: null, currentRoom: null, editingPhoto: null, lightbox: null };
let pendingMediaTarget = null;

function uid(){ return 'insp_' + Math.random().toString(36).slice(2,9); }
function mediaId(){ return 'm_' + Math.random().toString(36).slice(2,10); }
function jsEsc(s){ return String(s).replace(/'/g, "\\'"); }

/* --- Raw photo/video blobs live in IndexedDB (window.storage is for small JSON state only) --- */
const MEDIA_DB = 'fieldwalk_media';
const MEDIA_STORE = 'blobs';
let mediaDbPromise = null;
function openMediaDB(){
  if(mediaDbPromise) return mediaDbPromise;
  mediaDbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(MEDIA_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(MEDIA_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return mediaDbPromise;
}
async function putMediaBlob(id, blob){
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, 'readwrite');
    tx.objectStore(MEDIA_STORE).put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getMediaBlob(id){
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, 'readonly');
    const req = tx.objectStore(MEDIA_STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function deleteMediaBlob(id){
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, 'readwrite');
    tx.objectStore(MEDIA_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function imageThumbFromFile(file, maxW){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.65));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image decode failed')); };
    img.src = url;
  });
}

function videoThumbFromFile(file, maxW){
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    const url = URL.createObjectURL(file);
    video.preload = 'metadata';
    video.muted = true;
    video.playsInline = true;
    video.src = url;
    video.onloadedmetadata = () => {
      video.currentTime = Math.min(0.3, (video.duration || 1) / 2);
    };
    video.onseeked = () => {
      const vw = video.videoWidth || 320, vh = video.videoHeight || 240;
      const scale = Math.min(1, maxW / vw);
      const w = Math.max(1, Math.round(vw * scale)), h = Math.max(1, Math.round(vh * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(video, 0, 0, w, h);
      const duration = video.duration;
      URL.revokeObjectURL(url);
      resolve({ thumb: canvas.toDataURL('image/jpeg', 0.65), duration });
    };
    video.onerror = () => { URL.revokeObjectURL(url); reject(new Error('video decode failed')); };
  });
}

function formatDuration(sec){
  if(!sec || !isFinite(sec)) return '';
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

async function loadState(){
  try{
    const idx = await window.storage.get('inspections-index', false);
    if(idx && idx.value){
      state.order = JSON.parse(idx.value);
      for(const id of state.order){
        try{
          const rec = await window.storage.get('inspection:'+id, false);
          if(rec) state.inspections[id] = JSON.parse(rec.value);
        }catch(e){}
      }
    }
  }catch(e){}
  render();
}

async function saveIndex(){
  try{ await window.storage.set('inspections-index', JSON.stringify(state.order), false); }catch(e){}
}
async function saveInspection(id){
  try{ await window.storage.set('inspection:'+id, JSON.stringify(state.inspections[id]), false); }catch(e){}
}

function newInspection(){
  const id = uid();
  const rooms = {};
  DEFAULT_ROOMS.forEach(r => rooms[r] = blankRoom());
  const exterior = {};
  EXTERIOR_ZONES.forEach(z => exterior[z] = blankRoom());
  state.inspections[id] = {
    id, address:"", type:"Pre-occupancy", inspector:"", date:new Date().toISOString().slice(0,10),
    linkedInspectionId: "",
    rooms, roomOrder:[...DEFAULT_ROOMS], exterior,
    appliances: []
  };
  state.order.unshift(id);
  state.currentId = id;
  saveIndex(); saveInspection(id);
  goto("setup");
}

function blankRoom(){
  const c = {};
  ROOM_CHECKLIST.forEach(item => c[item] = "good");
  return { conditions:c, notes:"", videos:[], photos:[] };
}

function goto(view, opts){
  state.view = view;
  if(opts && opts.room !== undefined) state.currentRoom = opts.room;
  render();
  window.scrollTo(0,0);
}

function current(){ return state.inspections[state.currentId]; }
function zoneOf(insp, key){ return EXTERIOR_ZONES.includes(key) ? insp.exterior[key] : insp.rooms[key]; }
function linkedInspection(insp){ return insp.linkedInspectionId ? state.inspections[insp.linkedInspectionId] : null; }

function condRank(v){ return v === 'poor' ? 2 : v === 'fair' ? 1 : 0; }
function zoneRating(zone){
  const vals = Object.values(zone.conditions);
  if(vals.some(v => v === 'poor')) return 'poor';
  if(vals.some(v => v === 'fair')) return 'fair';
  return 'good';
}
function zonePercentages(zone){
  const vals = Object.values(zone.conditions);
  const total = vals.length || 1;
  const good = vals.filter(v => v === 'good').length;
  const fair = vals.filter(v => v === 'fair').length;
  const poor = vals.filter(v => v === 'poor').length;
  return { good: Math.round(good/total*100), fair: Math.round(fair/total*100), poor: Math.round(poor/total*100) };
}

function allZoneEntries(insp){
  return [
    ...insp.roomOrder.map(r => ({name:r, data:insp.rooms[r]})),
    ...EXTERIOR_ZONES.map(z => ({name:z, data:insp.exterior[z]}))
  ];
}

function buildComparison(insp, prior){
  return allZoneEntries(insp)
    .filter(e => prior && zoneOf(prior, e.name))
    .map(e => {
      const priorRating = zoneRating(zoneOf(prior, e.name));
      const curRating = zoneRating(e.data);
      return { name: e.name, priorRating, curRating, degraded: condRank(curRating) > condRank(priorRating) };
    });
}

function roomProgress(insp){
  const total = insp.roomOrder.length + EXTERIOR_ZONES.length;
  let done = 0;
  allZoneEntries(insp).forEach(e => { if(e.data.notes || e.data.photos.length>0 || e.data.videos.length>0) done++; });
  return Math.round((done/total)*100);
}

function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const app = document.getElementById('app');
  const backBtn = document.getElementById('backBtn');
  const brand = document.getElementById('brandLabel');
  backBtn.style.visibility = state.view === 'home' ? 'hidden' : 'visible';
  brand.textContent = state.view === 'home' ? 'Fieldwalk' : (state.view === 'report' ? 'Report' : 'Inspection');

  if(state.view === 'home') renderHome(app);
  else if(state.view === 'setup') renderSetup(app);
  else if(state.view === 'walkthrough') renderWalkthrough(app);
  else if(state.view === 'report') renderReport(app);
  renderLightbox();
}

function renderLightbox(){
  const root = document.getElementById('lightboxRoot');
  if(!state.lightbox){ root.innerHTML = ''; return; }
  const { kind, url } = state.lightbox;
  if(!url){
    root.innerHTML = `<div class="lightbox"><button class="close" onclick="closeLightbox()">&times;</button><div class="loading">Loading…</div></div>`;
    return;
  }
  const media = kind === 'video' ? `<video src="${url}" controls autoplay playsinline></video>` : `<img src="${url}">`;
  root.innerHTML = `<div class="lightbox"><button class="close" onclick="closeLightbox()">&times;</button>${media}</div>`;
}

async function openLightbox(kind, id){
  state.lightbox = { kind, id, url:null };
  render();
  try{
    const blob = await getMediaBlob(id);
    const url = URL.createObjectURL(blob);
    if(state.lightbox && state.lightbox.id === id){
      state.lightbox.url = url;
      renderLightbox();
    }
  }catch(e){}
}
function closeLightbox(){
  if(state.lightbox && state.lightbox.url) URL.revokeObjectURL(state.lightbox.url);
  state.lightbox = null;
  renderLightbox();
}

function renderHome(app){
  const items = state.order.map(id => state.inspections[id]).filter(Boolean);
  let html = `<div class="section-title">Your inspections</div>`;
  if(items.length === 0){
    html += `<div class="empty"><i class="ti">&#9633;</i>No inspections yet. Start a walkthrough to capture unit condition, appliances, and exterior zones.</div>`;
  } else {
    items.forEach(insp => {
      const pct = roomProgress(insp);
      html += `<div class="home-item" onclick="openInspection('${insp.id}')">
        <div>
          <div class="addr">${esc(insp.address) || 'Untitled unit'}</div>
          <div class="sub">${esc(insp.type)} &middot; ${esc(insp.date)} &middot; ${pct}% complete</div>
        </div>
        <span style="color:var(--steel); font-size:18px;">&rsaquo;</span>
      </div>`;
    });
  }
  html += `<button class="btn btn-primary" style="margin-top:10px;" onclick="newInspection()">+ New inspection</button>`;
  app.innerHTML = html;
}

function openInspection(id){
  state.currentId = id;
  goto('setup');
}

function renderSetup(app){
  const insp = current();

    <div class="section-title">Unit details</div>
    <div class="card">
      <label>Property address</label>
      <input type="text" id="f_address" value="${esc(insp.address)}" placeholder="123 Ocean Ave, Unit 2, Portsmouth NH">

      <select id="f_type" onchange="onTypeChange()">

      </select>

      <input type="text" id="f_inspector" value="${esc(insp.inspector)}" placeholder="Tech name">
      <label>Date</label>

      ${showLink ? `
      <label>Compare against prior inspection</label>
      <select id="f_link">
        <option value="">— None —</option>
        ${others.map(o => `<option value="${o.id}" ${insp.linkedInspectionId===o.id?'selected':''}>${esc(o.address)||'Untitled unit'} — ${esc(o.type)} (${esc(o.date)})</option>`).join('')}

function onTypeChange(){
  const insp = current();
  insp.address = document.getElementById('f_address').value;
  insp.type = document.getElementById('f_type').value;
  insp.inspector = document.getElementById('f_inspector').value;
  insp.date = document.getElementById('f_date').value;
  render();
}

function saveSetupAndContinue(){
  const insp = current();
  insp.address = document.getElementById('f_address').value;
  insp.type = document.getElementById('f_type').value;
  insp.inspector = document.getElementById('f_inspector').value;
  insp.date = document.getElementById('f_date').value;
  const linkEl = document.getElementById('f_link');
  insp.linkedInspectionId = linkEl ? linkEl.value : "";
  saveInspection(insp.id);
  state.currentRoom = insp.roomOrder[0];
  goto('walkthrough');
}

function renderWalkthrough(app){
  const insp = current();
  const pct = roomProgress(insp);
  const allZones = [...insp.roomOrder.map(r=>({key:r, ext:false})), ...EXTERIOR_ZONES.map(z=>({key:z, ext:true}))];
  if(!state.currentRoom) state.currentRoom = insp.roomOrder[0];
  const activeKey = state.currentRoom;
  const isExt = EXTERIOR_ZONES.includes(activeKey);
  const zone = isExt ? insp.exterior[activeKey] : insp.rooms[activeKey];

  let chips = allZones.map(z => {
    const d = z.ext ? insp.exterior[z.key] : insp.rooms[z.key];
    const done = d.notes || d.photos.length>0 || d.videos.length>0;
    return `<div class="room-chip ${z.key===activeKey?'active':''} ${done?'done':''}" onclick="selectRoom('${jsEsc(z.key)}')">${esc(z.key)}</div>`;
  }).join('');

  let checklist = ROOM_CHECKLIST.map(item => {
    const cond = zone.conditions[item] || 'good';
    return `<div class="check-row">
      <span class="check-name">${item}</span>
      <button class="cond-btn ${cond}" onclick="cycleCondition('${jsEsc(activeKey)}', ${isExt}, '${jsEsc(item)}')">${cond}</button>
    </div>`;
  }).join('');

  let videoRow = zone.videos.map(v => `
    <div class="video-thumb" onclick="openLightbox('video','${v.id}')">
      <img src="${v.thumb}">
      <div class="play">&#9658;</div>
      ${v.duration ? `<div class="dur">${formatDuration(v.duration)}</div>` : ''}
      <button class="del" onclick="event.stopPropagation(); removeVideo('${jsEsc(activeKey)}', ${isExt}, '${v.id}')">&times;</button>
    </div>
  `).join('');

  let photoGrid = zone.photos.map(p => `
    <div class="dphoto" onclick="toggleEditPhoto('${p.id}')">
      <img src="${p.thumb}">
      ${p.note ? `<div class="flagdot">FLAG</div>` : ''}
    </div>
  `).join('');

  let photoEditor = '';
  if(state.editingPhoto){
    const p = zone.photos.find(p => p.id === state.editingPhoto);
    if(p){
      photoEditor = `
        <div class="photo-editor">
          <img src="${p.thumb}" onclick="openLightbox('photo','${p.id}')">
          <label>Damage note</label>
          <textarea id="photoNoteInput" placeholder="Describe the damage (e.g. 2in gouge in hardwood floor near closet door)">${esc(p.note)}</textarea>
          <div class="btn-row" style="margin-top:10px;">
            <button class="btn btn-ghost btn-sm" onclick="removePhoto('${jsEsc(activeKey)}', ${isExt}, '${p.id}')">Delete photo</button>
            <button class="btn btn-primary btn-sm" onclick="toggleEditPhoto('${p.id}')">Done</button>
          </div>
        </div>
      `;
    }
  }

  let applianceSection = '';
  if(!isExt){
    const roomAppliances = insp.appliances.filter(a => a.room === activeKey);
    applianceSection = `
      <div class="section-title">Appliances in this room</div>
      ${roomAppliances.map((a,i) => applianceCardHTML(a, insp.appliances.indexOf(a))).join('')}
      <button class="btn btn-ghost btn-sm" style="width:100%; margin-bottom:16px;" onclick="addAppliance('${jsEsc(activeKey)}')">+ Add appliance</button>
    `;
  }

  app.innerHTML = `
    <div class="tag">
      <p class="tag-label">${esc(insp.type)} inspection</p>
      <p class="tag-address">${esc(insp.address) || 'Untitled unit'}</p>
      <div class="tag-meta">
        <span>Inspector <b>${esc(insp.inspector)||'—'}</b></span>
        <span>Date <b>${esc(insp.date)}</b></span>
      </div>
      <div class="tag-progress"><div class="tag-progress-fill" style="width:${pct}%;"></div></div>
    </div>

    <div class="room-list">${chips}</div>

    <div class="section-title">${esc(activeKey)} &mdash; walkthrough video</div>
    <div class="media-row">
      ${videoRow}
      <button class="media-add" onclick="recordVideo('${jsEsc(activeKey)}')">&#9679; Record</button>
    </div>

    <div class="section-title">Damage photos</div>
    <div class="dphoto-grid">
      ${photoGrid}
      <button class="dphoto-add" onclick="addDamagePhoto('${jsEsc(activeKey)}')">+</button>
    </div>
    ${photoEditor}

    <div class="section-title">Condition checklist</div>
    <div class="card">${checklist}</div>

    <div class="section-title">Notes</div>
    <div class="card">
      <textarea id="roomNotes" placeholder="Describe condition, damage, or anything notable...">${esc(zone.notes)}</textarea>
    </div>

    ${applianceSection}

    <div class="btn-row" style="margin-top:8px;">
      <button class="btn btn-ghost" onclick="goto('home')">Save & exit</button>
      <button class="btn btn-primary" onclick="goto('report')">View report</button>
    </div>
  `;

  document.getElementById('roomNotes').addEventListener('blur', function(){
    saveNotes(activeKey, isExt, this.value);
  });
  if(state.editingPhoto){
    const noteEl = document.getElementById('photoNoteInput');
    if(noteEl){
      noteEl.addEventListener('blur', function(){
        updatePhotoNote(activeKey, isExt, state.editingPhoto, this.value);
      });
    }
  }
}

function applianceCardHTML(a, idx){
  const hint = APPLIANCE_TYPES[a.type] || "";
  return `<div class="appliance-card">
    <div class="appliance-head">
      <b>${esc(a.type)}</b>
      <button class="remove" onclick="removeAppliance(${idx})">Remove</button>
    </div>
    <label>Model number</label>
    <input class="mono" type="text" value="${esc(a.model)}" onblur="updateAppliance(${idx},'model',this.value)" placeholder="Model #">
    <label>Serial number</label>
    <input class="mono" type="text" value="${esc(a.serial)}" onblur="updateAppliance(${idx},'serial',this.value)" placeholder="Serial #">
    <label>Install / purchase date</label>
    <input type="date" value="${esc(a.installDate)}" onchange="updateAppliance(${idx},'installDate',this.value)">
    ${hint ? `<div class="maint-hint">${hint}</div>` : ''}
  </div>`;
}

function selectRoom(key){ state.currentRoom = key; state.editingPhoto = null; render(); }

function cycleCondition(roomKey, isExt, item){
  const insp = current();
  const data = isExt ? insp.exterior[roomKey] : insp.rooms[roomKey];
  const order = ['good','fair','poor'];
  const next = order[(order.indexOf(data.conditions[item])+1) % order.length];
  data.conditions[item] = next;
  saveInspection(insp.id);
  render();
}

function saveNotes(roomKey, isExt, val){
  const insp = current();
  const data = isExt ? insp.exterior[roomKey] : insp.rooms[roomKey];
  data.notes = val;
  saveInspection(insp.id);
}

function recordVideo(zoneKey){
  pendingMediaTarget = { room: zoneKey };
  document.getElementById('videoInput').click();
}
function addDamagePhoto(zoneKey){
  pendingMediaTarget = { room: zoneKey };
  document.getElementById('photoInput').click();
}

document.getElementById('photoInput').addEventListener('change', async function(e){
  if(!pendingMediaTarget) return;
  const insp = current();
  const zone = zoneOf(insp, pendingMediaTarget.room);
  const files = Array.from(e.target.files);
  let lastId = null;
  for(const file of files){
    try{
      const id = mediaId();
      const thumb = await imageThumbFromFile(file, 320);
      await putMediaBlob(id, file);
      zone.photos.push({ id, thumb, note:'', createdAt: Date.now() });
      lastId = id;
    }catch(err){}
  }
  saveInspection(insp.id);
  if(lastId) state.editingPhoto = lastId;
  render();
  e.target.value = '';
});

document.getElementById('videoInput').addEventListener('change', async function(e){
  if(!pendingMediaTarget) return;
  const insp = current();
  const zone = zoneOf(insp, pendingMediaTarget.room);
  const files = Array.from(e.target.files);
  for(const file of files){
    try{
      const { thumb, duration } = await videoThumbFromFile(file, 320);
      const id = mediaId();
      await putMediaBlob(id, file);
      zone.videos.push({ id, thumb, duration, createdAt: Date.now() });
    }catch(err){}
  }
  saveInspection(insp.id);
  render();
  e.target.value = '';
});

function toggleEditPhoto(id){
  state.editingPhoto = state.editingPhoto === id ? null : id;
  render();
}

function updatePhotoNote(roomKey, isExt, id, val){
  const insp = current();
  const zone = isExt ? insp.exterior[roomKey] : insp.rooms[roomKey];
  const p = zone.photos.find(p => p.id === id);
  if(p){ p.note = val; saveInspection(insp.id); }
}

async function removePhoto(roomKey, isExt, id){
  const insp = current();
  const zone = isExt ? insp.exterior[roomKey] : insp.rooms[roomKey];
  zone.photos = zone.photos.filter(p => p.id !== id);
  if(state.editingPhoto === id) state.editingPhoto = null;
  saveInspection(insp.id);
  render();
  deleteMediaBlob(id).catch(()=>{});
}

async function removeVideo(roomKey, isExt, id){
  const insp = current();
  const zone = isExt ? insp.exterior[roomKey] : insp.rooms[roomKey];
  zone.videos = zone.videos.filter(v => v.id !== id);
  saveInspection(insp.id);
  render();
  deleteMediaBlob(id).catch(()=>{});
}

function addAppliance(room){
  const insp = current();
  insp.appliances.push({ room, type:"Refrigerator", model:"", serial:"", installDate:"" });
  saveInspection(insp.id);
  render();
}
function updateAppliance(idx, field, val){
  const insp = current();
  insp.appliances[idx][field] = val;
  saveInspection(insp.id);
}
function removeAppliance(idx){
  const insp = current();
  insp.appliances.splice(idx,1);
  saveInspection(insp.id);
  render();
}

function renderReport(app){
  const insp = current();

      <div class="section-title">${esc(e.name)}</div>

        </div>
        ${e.data.notes ? `<div style="font-size:13px; margin-bottom:10px;">${esc(e.data.notes)}</div>` : ''}

      <div class="mono" style="font-size:12px; color:var(--steel);">Model ${esc(a.model)||'—'} &middot; Serial ${esc(a.serial)||'—'}</div>

function renderComparisonHTML(insp, prior, comparison){
  const degradedZones = comparison.filter(c => c.degraded);
  return `
    <div class="section-title">Move-in &rarr; move-out comparison</div>
    <div class="card" style="margin-bottom:10px; font-size:12.5px; color:var(--steel);">
      Compared against ${esc(prior.type)} inspection dated ${esc(prior.date)}.
    </div>
    <div class="card">
      ${comparison.map(c => `
        <div class="report-row">
          <span class="k">${esc(c.name)}</span>
          <span>
            <span class="rating-pill ${c.priorRating}">${c.priorRating}</span>
            &rarr;
            <span class="rating-pill ${c.curRating}">${c.curRating}</span>
            ${c.degraded ? `<span class="flag-pill" style="margin-left:6px;">new damage</span>` : ''}
          </span>
        </div>
      `).join('')}
    </div>
    ${degradedZones.length ? `
      <div class="section-title">Damage flagged since move-in</div>
      ${degradedZones.map(c => {
        const zoneData = zoneOf(insp, c.name);
        return `<div class="card" style="margin-bottom:8px;">
          <div style="font-weight:500; font-size:14px; margin-bottom:6px;">${esc(c.name)}</div>
          ${zoneData.photos.length ? `<div class="dphoto-grid">${zoneData.photos.map(p=>`<div class="dphoto" onclick="openLightbox('photo','${p.id}')"><img src="${p.thumb}"></div>`).join('')}</div>` : `<div style="font-size:12.5px; color:var(--steel);">No damage photos logged for this zone yet — add one from the walkthrough.</div>`}
          ${zoneData.photos.filter(p=>p.note).map(p=>`<div style="font-size:12.5px; color:var(--red-dark); margin-top:6px;">&#9873; ${esc(p.note)}</div>`).join('')}
        </div>`;
      }).join('')}
    ` : ''}
  `;
}

function copyReport(){
  const insp = current();
  const entries = allZoneEntries(insp);
  let lines = [];
  lines.push(`${insp.type.toUpperCase()} INSPECTION — ${insp.address || 'Untitled unit'}`);
  lines.push(`Inspector: ${insp.inspector || '—'}   Date: ${insp.date}`);
  lines.push('');
  lines.push('ZONE SUMMARY');
  entries.forEach(e => {
    const rating = zoneRating(e.data);
    lines.push(`- ${e.name}: ${rating.toUpperCase()} (${e.data.photos.length} flagged, ${e.data.videos.length} video)`);
    if(e.data.notes) lines.push(`    Notes: ${e.data.notes}`);
    e.data.photos.forEach(p => { if(p.note) lines.push(`    Flag: ${p.note}`); });
  });
  const prior = linkedInspection(insp);
  if(prior){
    lines.push('');
    lines.push(`COMPARISON AGAINST: ${prior.type.toUpperCase()} — ${prior.date}`);
    buildComparison(insp, prior).forEach(c => {
      lines.push(`- ${c.name}: ${c.priorRating} -> ${c.curRating}${c.degraded ? '  [NEW DAMAGE]' : ''}`);
    });
  }
  lines.push('');
  lines.push('APPLIANCES');
  insp.appliances.forEach(a=>{
    lines.push(`- ${a.type} (${a.room}): model ${a.model||'—'}, serial ${a.serial||'—'}, installed ${a.installDate||'—'}`);
  });
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(()=>alert('Report copied to clipboard.')).catch(()=>alert(text));
}

function exportReportPDF(){
  const insp = current();
  const filename = ['Fieldwalk', insp.address || 'Untitled unit', insp.type, insp.date]
    .filter(Boolean).join(' - ').replace(/[\\/:*?"<>|]/g, '-');
  const prevTitle = document.title;
  document.title = filename;
  const restore = () => { document.title = prevTitle; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
}

document.getElementById('backBtn').addEventListener('click', function(){
  if(state.view === 'setup' || state.view === 'walkthrough' || state.view === 'report') goto('home');
});

loadState();
</script>
</body>
